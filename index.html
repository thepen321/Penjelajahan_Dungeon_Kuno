<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --bg-dark: #0d0b10;
      --panel-bg: #17131d;
      --panel-border: #3c2f4d;
      --gold: #f5b942;
      --crimson: #e03c52;
      --emerald: #36c978;
      --cyan: #38bdf8;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      background-color: #070609;
      color: #ede6f2;
      font-family: 'VT323', monospace;
      font-size: 19px;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .font-pixel {
      font-family: 'Press Start 2P', monospace;
      line-height: 1.45;
    }

    .font-medieval {
      font-family: 'Cinzel', serif;
    }

    /* Mobile-first App Shell */
    #app-shell {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: radial-gradient(circle at top, #1f1929 0%, #0d0b10 85%);
      border-left: 2px solid #2b2238;
      border-right: 2px solid #2b2238;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
    }

    /* Crisp Pixel Canvas */
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Retro Bevel Buttons */
    .btn-pixel {
      position: relative;
      border: 2px solid #594673;
      background: linear-gradient(180deg, #2a2138 0%, #1a1424 100%);
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.12), 0 4px 0 #09070c;
      transition: transform 0.08s ease, filter 0.12s ease;
      cursor: pointer;
    }
    .btn-pixel:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.08), 0 1px 0 #09070c;
    }
    .btn-pixel:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-gold {
      border-color: #d99326;
      background: linear-gradient(180deg, #6b4712 0%, #3d2607 100%);
      color: #ffe39e;
    }
    .btn-crimson {
      border-color: #b8283b;
      background: linear-gradient(180deg, #631622 0%, #380b12 100%);
      color: #ffd1d8;
    }
    .btn-emerald {
      border-color: #269959;
      background: linear-gradient(180deg, #155934 0%, #0b331d 100%);
      color: #c7ffe0;
    }
    .btn-cyan {
      border-color: #2589bd;
      background: linear-gradient(180deg, #134a69 0%, #092738 100%);
      color: #ccf0ff;
    }

    /* Rate Badges */
    .rate-D, .rate-D- { color: #a3a3a3; border-color: #525252; background: #262626; }
    .rate-C { color: #6ee7b7; border-color: #059669; background: #064e3b; }
    .rate-B, .rate-B\+ { color: #60a5fa; border-color: #2563eb; background: #1e3a8a; }
    .rate-A, .rate-A\+ { color: #c084fc; border-color: #9333ea; background: #4c1d95; }
    .rate-S, .rate-S\+ { color: #fbbf24; border-color: #d97706; background: #78350f; }
    .rate-SS, .rate-SS\+ { color: #f87171; border-color: #dc2626; background: #7f1d1d; }
    .rate-SSS, .rate-SSS\+ {
      color: #fff;
      border-color: #f43f5e;
      background: linear-gradient(90deg, #9333ea, #e11d48, #d97706);
      text-shadow: 0 1px 2px #000;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #120f17; }
    ::-webkit-scrollbar-thumb { background: #453659; border-radius: 3px; }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 8px rgba(245, 185, 66, 0.4); }
      50% { box-shadow: 0 0 18px rgba(245, 185, 66, 0.85); }
    }
    .glow-gold { animation: pulseGlow 2s infinite; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .anim-shake { animation: shake 0.35s ease; }
  </style>
</head>

  <script>
    /* ==========================================================================
       1. RETRO-MODERN WEB AUDIO SYNTHESIZER (Zero external audio dependencies)
       ========================================================================== */
    const SoundFX = (() => {
      let ctx = null;
      let muted = false;

      function ensureCtx() {
        if (!ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) ctx = new AudioContext();
        }
        if (ctx && ctx.state === 'suspended') {
          ctx.resume().catch(() => {});
        }
      }

      // Unlock AudioContext seamlessly on first mobile touch or click
      ['touchstart', 'pointerdown', 'click'].forEach(evt => {
        window.addEventListener(evt, ensureCtx, { once: true, passive: true });
      });

      function playTone(freq, type = 'square', duration = 0.12, vol = 0.08, slideTo = null, delay = 0) {
        if (muted) return;
        try {
          ensureCtx();
          if (!ctx) return;
          const startTime = ctx.currentTime + delay;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, startTime);
          if (slideTo) {
            osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), startTime + duration);
          }
          gain.gain.setValueAtTime(0.0001, startTime);
          gain.gain.linearRampToValueAtTime(vol, startTime + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + duration + 0.01);
        } catch (e) {}
      }

      function playNoise(duration = 0.12, vol = 0.07, filterFreq = 900, delay = 0) {
        if (muted) return;
        try {
          ensureCtx();
          if (!ctx) return;
          const startTime = ctx.currentTime + delay;
          const bufferSize = Math.floor(ctx.sampleRate * duration);
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          const noise = ctx.createBufferSource();
          noise.buffer = buffer;

          const filter = ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(filterFreq, startTime);

          const gain = ctx.createGain();
          gain.gain.setValueAtTime(vol, startTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          noise.start(startTime);
          noise.stop(startTime + duration + 0.01);
        } catch (e) {}
      }

      function updateToggleUI() {
        const btn = document.getElementById('btn-sfx-toggle');
        if (!btn) return;
        if (muted) {
          btn.textContent = '🔇 MUTE';
          btn.className = 'btn-pixel px-2 py-1.5 rounded text-xs font-bold text-rose-400';
        } else {
          btn.textContent = '🔊 SFX';
          btn.className = 'btn-pixel px-2 py-1.5 rounded text-xs font-bold text-emerald-300';
        }
      }

      return {
        isMuted: () => muted,
        setMuted: (val) => {
          muted = !!val;
          updateToggleUI();
        },
        toggleMute: () => {
          muted = !muted;
          updateToggleUI();
          if (!muted) {
            ensureCtx();
            playTone(580, 'square', 0.07, 0.06);
          }
        },
        // 1. UI button/tab tap
        click: () => playTone(560, 'square', 0.055, 0.05, 420),
        // 2. Wooden dungeon door creak & thud
        door: () => {
          playTone(150, 'sawtooth', 0.14, 0.07, 95, 0);
          playTone(95, 'triangle', 0.12, 0.09, 55, 0.12);
        },
        // 3. Descending footsteps echo on stairs
        stairs: () => {
          [260, 220, 185, 150].forEach((f, i) => {
            playTone(f, 'triangle', 0.09, 0.07, f * 0.8, i * 0.085);
          });
        },
        // 4. Sword slash + impact (heavier/deeper for higher tier weapons)
        attack: (tierIndex = 0, isCrit = false) => {
          const baseFreq = Math.max(110, 260 - tierIndex * 11);
          playNoise(0.11, 0.09, 1400 - tierIndex * 40, 0);
          playTone(baseFreq, 'sawtooth', 0.16, 0.1, 55, 0.02);
          if (isCrit) {
            playTone(520, 'square', 0.08, 0.09, 880, 0.06);
            playTone(780, 'square', 0.14, 0.09, 1120, 0.12);
          }
        },
        // 5. Black Flame Dragon: One Slash One Kill roaring flame slash
        skill: () => {
          playNoise(0.42, 0.13, 650, 0);
          playTone(220, 'sawtooth', 0.35, 0.12, 48, 0.02);
          playTone(440, 'square', 0.18, 0.1, 980, 0.08);
          playTone(660, 'square', 0.25, 0.1, 1320, 0.18);
        },
        // 6. Monster strike / taking damage (metallic block vs heavy HP thud)
        hit: (shieldOnly = false) => {
          if (shieldOnly) {
            playTone(720, 'triangle', 0.09, 0.09, 980, 0);
            playTone(1180, 'sine', 0.14, 0.07, 640, 0.04);
          } else {
            playNoise(0.14, 0.1, 480, 0);
            playTone(125, 'sawtooth', 0.22, 0.12, 42, 0);
          }
        },
        // 7. Metallic shield raise / guard chime
        defend: () => {
          playTone(390, 'triangle', 0.1, 0.08, 520, 0);
          playTone(660, 'sine', 0.16, 0.08, 780, 0.06);
        },
        // 8. Sparkly ascending arpeggio chime for consumables & revival
        heal: () => {
          [440, 554, 659, 880].forEach((f, i) => {
            playTone(f, 'sine', 0.14, 0.075, null, i * 0.065);
          });
        },
        // 9. Treasure chest chime (extra fanfare for S/SS/SSS rare items)
        loot: (isHighTier = false) => {
          const notes = isHighTier ? [523, 659, 784, 1046, 1318] : [523, 659, 784];
          notes.forEach((f, i) => {
            playTone(f, 'square', i === notes.length - 1 ? 0.22 : 0.09, 0.075, null, i * 0.075);
          });
        },
        // 10. Double-coin clink when buying/selling or claiming achievements
        coin: () => {
          playTone(987, 'sine', 0.08, 0.08, null, 0);
          playTone(1318, 'sine', 0.18, 0.08, null, 0.065);
        },
        // 11. Subtle ticking pulse when timer drops below 4 seconds
        timerWarn: () => {
          playTone(880, 'sine', 0.045, 0.04, 720, 0);
        },
        // 12. Retreating footsteps + whoosh when escaping
        run: () => {
          playNoise(0.18, 0.07, 1100, 0);
          [320, 280, 350, 290].forEach((f, i) => {
            playTone(f, 'triangle', 0.07, 0.06, f * 0.75, i * 0.06);
          });
        },
        // 13. Ethereal ascending harmonic beam for Extraction light pillar
        extract: () => {
          [330, 440, 554, 659, 880, 1108, 1318].forEach((f, i) => {
            playTone(f, 'sine', 0.32, 0.075, f * 1.03, i * 0.09);
          });
        },
        // 14. Somber descending retro defeat melody

          [311, 277, 246, 185].forEach((f, i) => {
            playTone(f, 'sawtooth', 0.24, 0.085, f * 0.94, i * 0.15);
          });
        }
      };
    })();

    function loadGame() {
      try {

        if (raw) {

          player = { ...player, ...parsed, stats: { ...player.stats, ...(parsed.stats || {}) } };

    function getItemSlots(itemId) {
      const it = ITEM_DB[itemId];
      if (!it) return 1;
      return RATE_SLOTS[it.rate] || 1;
    }

    function calcUsedSlots(list) {
      return list.reduce((sum, entry) => sum + getItemSlots(entry.itemId), 0);
    }

    function isRateAtLeast(rate, minRate) {
      return RATE_ORDER.indexOf(rate) >= RATE_ORDER.indexOf(minRate);

        success: 'bg-[#123322] border-emerald-400 text-emerald-100',
        warn: 'bg-[#3b2810] border-amber-400 text-amber-100',
        danger: 'bg-[#3d121a] border-rose-500 text-rose-100'
      };
      el.className = `px-3 py-2 rounded border-l-4 shadow-lg text-sm font-bold transition-all duration-300 ${colors[type] || colors.info}`;

    function renderShop(container) {

        { id: 'weapon', label: '⚔️ Senjata' },
        { id: 'armor', label: '🛡️ Armor' },

      ];

      let contentHtml = '';

      if (shopTab === 'weapon' || shopTab === 'armor' || shopTab === 'consumable') {
        const items = Object.values(ITEM_DB).filter(i => i.type === shopTab);
        contentHtml = items.map(it => `
          <div class="p-2.5 rounded-lg bg-[#16121f] border border-[#36294a] flex items-center justify-between gap-2.5">
            <div class="flex items-start gap-2.5 min-w-0">

              <span class="font-medieval font-bold text-amber-300">🎒 Upgrade Kapasitas Backpack</span>
              <span class="text-xs bg-amber-950 px-2 py-0.5 rounded text-amber-200">${player.backpackCap} / 100 Kotak</span>
            </div>
            <p class="text-xs text-gray-300">Memperbesar kapasitas tas saat menjelajah dungeon agar dapat membawa lebih banyak harta Rate tinggi.</p>

          contentHtml = `<div class="text-center py-8 text-gray-400">Inventori Lobby kosong. Jelajahi dungeon untuk mencari harta!</div>`;

    function buyShopItem(itemId) {
      const it = ITEM_DB[itemId];
      if (!it) return;
      if (player.gold < it.price) {
        SoundFX.hit(false);
        showToast('Gold tidak mencukupi!', 'danger');
        return;
      }
      player.gold -= it.price;
      player.lobbyInventory.push({ uid: genUid(), itemId });
      SoundFX.coin();
      showToast(`Membeli ${it.name}!`, 'success');
      saveGame();
      renderScreen();
    }

    function upgradeBackpack() {
      const cost = player.backpackCap * 25;
      if (player.gold < cost) {
        SoundFX.hit(false);
        showToast('Gold tidak cukup untuk upgrade tas!', 'danger');
        return;
      }
      player.gold -= cost;
      player.backpackCap = Math.min(100, player.backpackCap + 10);
      SoundFX.coin();
      showToast(`Kapasitas Backpack menjadi ${player.backpackCap} kotak!`, 'success');
      saveGame();
      renderScreen();
    }

    function buySkin(skinId) {
      const sk = SKINS_DB.find(s => s.id === skinId);
      if (!sk || player.gold < sk.price) {
        SoundFX.hit(false);
        showToast('Gold tidak mencukupi!', 'danger');
        return;
      }
      player.gold -= sk.price;
      player.unlockedSkins.push(skinId);
      player.selectedSkin = skinId;
      SoundFX.coin();
      showToast(`Karakter ${sk.name} terbuka & digunakan!`, 'success');
      saveGame();
      renderScreen();
    }

    function selectSkin(skinId) {
      player.selectedSkin = skinId;
      SoundFX.click();
      saveGame();
      renderScreen();
    }

    function sellLobbyItem(uid) {
      const idx = player.lobbyInventory.findIndex(e => e.uid === uid);
      if (idx === -1) return;
      const it = ITEM_DB[player.lobbyInventory[idx].itemId];
      const sellVal = Math.max(5, Math.floor(it.type === 'valuable' ? it.price : it.price * 0.65));
      player.lobbyInventory.splice(idx, 1);
      player.gold += sellVal;
      SoundFX.coin();
      showToast(`Menjual ${it.name} (+${sellVal} Gold)`, 'success');
      saveGame();
      renderScreen();
    }

    /* ==========================================================================
       8. LOBBY INVENTORY & LOADOUT MANAGEMENT

    function renderLobbyInventory(container) {
      const wep = player.equippedWeapon ? ITEM_DB[player.equippedWeapon] : null;
      const arm = player.equippedArmor ? ITEM_DB[player.equippedArmor] : null;

      const sorted = [...player.lobbyInventory].sort((a, b) => {
        const ia = ITEM_DB[a.itemId], ib = ITEM_DB[b.itemId];
        if (!ia || !ib) return 0;
        if (invSortBy === 'rate') {
          return RATE_ORDER.indexOf(ib.rate) - RATE_ORDER.indexOf(ia.rate);
        }
        return ia.type.localeCompare(ib.type);
      });

      container.innerHTML = `
        <div class="p-3.5 space-y-3">
          <div class="flex items-center justify-between">
            <button onclick="navigate('lobby')" class="btn-pixel px-3 py-1.5 rounded text-sm">&larr; Lobby</button>
            <h2 class="font-medieval font-bold text-sky-300 text-lg">INVENTORI LOBBY</h2>
            <button onclick="invSortBy = invSortBy==='rate'?'type':'rate'; renderScreen();" class="btn-pixel px-2.5 py-1 rounded text-xs">
              Urut: ${invSortBy === 'rate' ? 'Rate' : 'Tipe'}
            </button>
          </div>

          <!-- ACTIVE EQUIPMENT -->
          <div class="grid grid-cols-2 gap-2">

              <div class="text-xs text-gray-400">Senjata Terpasang</div>
              <div class="font-bold text-amber-200 truncate">${wep ? wep.icon + ' ' + wep.name : 'Kosong'}</div>
              ${wep ? `<button onclick="unequipGear('weapon')" class="mt-1 text-xs text-rose-400 underline">Lepas</button>` : ''}
            </div>
            <div class="p-2.5 rounded-lg bg-[#191424] border border-sky-500/50">
              <div class="text-xs text-gray-400">Armor Terpasang</div>
              <div class="font-bold text-sky-200 truncate">${arm ? arm.icon + ' ' + arm.name : 'Kosong'}</div>

          <div class="text-xs text-gray-400">

          </div>

            ${sorted.length === 0 ? `<div class="text-center py-8 text-gray-500">Belum ada item tersimpan di Lobby.</div>` : sorted.map(entry => {
              const it = ITEM_DB[entry.itemId];
              if (!it) return '';
              const isEquip = it.type === 'weapon' || it.type === 'armor';
              return `
                <div class="p-2.5 rounded-lg bg-[#16121f] border border-[#36294a] flex items-center justify-between gap-2">
                  <div class="flex items-center gap-2.5 min-w-0">
                    <span class="text-2xl">${it.icon}</span>
                    <div class="min-w-0">
                      <div class="flex items-center gap-1.5">
                        <span class="font-bold text-amber-100 truncate">${it.name}</span>
                        <span class="text-[11px] px-1 rounded border rate-${it.rate}">${it.rate}</span>
                        <span class="text-[11px] text-gray-400">${getItemSlots(it.id)}ktk</span>
                      </div>
                      <div class="text-xs text-gray-400 truncate">${it.desc}</div>
                    </div>
                  </div>
                  <div class="flex items-center gap-1.5 shrink-0">
                    ${isEquip ? `<button onclick="equipFromLobby('${entry.uid}')" class="btn-pixel btn-cyan px-2.5 py-1.5 rounded text-xs font-bold">Pasang</button>` : ''}
                    <button onclick="sellLobbyItem('${entry.uid}')" class="btn-pixel px-2 py-1.5 rounded text-xs text-amber-300">Jual</button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;

    function equipFromLobby(uid) {
      const idx = player.lobbyInventory.findIndex(e => e.uid === uid);
      if (idx === -1) return;
      const it = ITEM_DB[player.lobbyInventory[idx].itemId];
      if (it.type === 'weapon') {
        if (player.equippedWeapon) player.lobbyInventory.push({ uid: genUid(), itemId: player.equippedWeapon });
        player.equippedWeapon = it.id;
      } else if (it.type === 'armor') {
        if (player.equippedArmor) player.lobbyInventory.push({ uid: genUid(), itemId: player.equippedArmor });
        player.equippedArmor = it.id;
      }
      player.lobbyInventory.splice(idx, 1);
      SoundFX.click();
      showToast(`Memasang ${it.name}`, 'info');
      saveGame();
      renderScreen();
    }

    function unequipGear(slot) {
      if (slot === 'weapon' && player.equippedWeapon) {
        player.lobbyInventory.push({ uid: genUid(), itemId: player.equippedWeapon });
        player.equippedWeapon = null;
      } else if (slot === 'armor' && player.equippedArmor) {
        player.lobbyInventory.push({ uid: genUid(), itemId: player.equippedArmor });
        player.equippedArmor = null;
      }
      SoundFX.click();
      saveGame();
      renderScreen();
    }

    function renderAchievements(container) {

          <div class="space-y-2.5">
            ${ACHIEVEMENTS_DB.map(ach => {

              const claimed = player.claimedAchievements.includes(ach.id);

                <div class="p-3 rounded-lg bg-[#16121f] border ${claimed ? 'border-emerald-700/60 opacity-75' : unlocked ? 'border-amber-400' : 'border-[#332745]'} flex items-center justify-between gap-2">
                  <div>
                    <div class="font-bold text-amber-200">${ach.name}</div>
                    <div class="text-xs text-gray-300">${ach.desc}</div>
                    <div class="text-xs text-amber-400 mt-1">Hadiah: +${ach.rewardGold} Gold</div>

                    : unlocked

    function claimAchievement(id) {
      const ach = ACHIEVEMENTS_DB.find(a => a.id === id);

      player.claimedAchievements.push(id);
      player.gold += ach.rewardGold;
      SoundFX.coin();
      showToast(`Achievement "${ach.name}" diklaim! +${ach.rewardGold} Gold`, 'success');
      saveGame();
      renderScreen();
    }

    /* ==========================================================================
       10. ACTIVE DUNGEON RUN ENGINE (Exploration, 15s Timers, Turn-Based Combat, Extraction)
       ========================================================================== */
    let run = null;
    let timerInterval = null;
    let animFrameId = null;

    function stopAllRunTimers() {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
    }

    function startDungeonRun(mode) {
      SoundFX.door();
      const mapObj = HUNT_MAPS.find(m => m.id === selectedHuntMap) || HUNT_MAPS[0];
      const diffObj = DIFFICULTIES.find(d => d.id === selectedHuntDiff) || DIFFICULTIES[1];
      const careerObj = CAREER_LEVELS.find(c => c.lv === player.careerLevel) || CAREER_LEVELS[CAREER_LEVELS.length - 1];

      // Determine starting equipment & starter pack
      let weaponId = player.equippedWeapon;
      let armorId = player.equippedArmor;
      const backpack = [];

      // Check if player has zero gear and empty lobby consumables -> grant Starter Pack!
      const lobbyConsumables = player.lobbyInventory.filter(e => ITEM_DB[e.itemId]?.type === 'consumable');
      if (!weaponId && !armorId && lobbyConsumables.length === 0) {
        weaponId = 'wooden_sword';
        armorId = 'leather_armor';
        backpack.push({ uid: genUid(), itemId: 'cookies' });
        backpack.push({ uid: genUid(), itemId: 'cookies' });
        backpack.push({ uid: genUid(), itemId: 'bandage' });
        showToast('Starter Pack diberikan: Wooden Sword, Leather Armor, 2x Cookies, 1x Bandage!', 'info');
      } else {
        if (!weaponId) weaponId = 'wooden_sword';
        if (!armorId) armorId = 'leather_armor';
        // Pack consumables from lobby into backpack up to capacity
        let garudaCount = 0;
        const remainingLobby = [];
        for (const entry of player.lobbyInventory) {
          const it = ITEM_DB[entry.itemId];
          if (it && it.type === 'consumable') {
            if (it.id === 'garuda_token' && garudaCount >= 1) {
              remainingLobby.push(entry);
              continue;
            }
            const cost = getItemSlots(it.id);
            if (calcUsedSlots(backpack) + cost <= player.backpackCap) {
              backpack.push({ ...entry, chargesLeft: it.charges || null });
              if (it.id === 'garuda_token') garudaCount++;
            } else {
              remainingLobby.push(entry);
            }
          } else {
            remainingLobby.push(entry);
          }
        }
        player.lobbyInventory = remainingLobby;
        saveGame();
      }

      const arm = ITEM_DB[armorId];
      const wep = ITEM_DB[weaponId];
      const skin = SKINS_DB.find(s => s.id === player.selectedSkin) || SKINS_DB[0];

      const maxHp = 1000 + (arm ? arm.bonusHp : 0) + (skin.id === 'paladin' ? 50 : 0);
      const maxShield = (arm ? arm.shield : 0);

      // Career scaling
      const autoScale = 1 + (player.careerLevel - 1) * 0.25;

      run = {
        mode,
        map: mode === 'hunt' ? mapObj : HUNT_MAPS[0],
        difficulty: mode === 'hunt' ? diffObj : { id: 'career', name: `Karir Lv.${player.careerLevel}`, hpMult: autoScale, dmgMult: autoScale, lootMult: 1 + player.careerLevel * 0.2 },
        careerTarget: mode === 'career' ? careerObj : null,
        floor: mode === 'hunt' ? mapObj.minFloor : 1,
        roomNum: 1,
        // Stats
        hp: maxHp,
        maxHp,
        shield: maxShield,
        maxShield,
        permSpiritShield: 0,
        maxPermSpiritShield: 0,
        spiritOrbCd: 0,
        // Gear
        weaponId,
        armorId,
        skillUsesLeft: wep && wep.maxSkillUses ? wep.maxSkillUses : 0,
        armorSkipsLeft: arm && arm.roomSkips ? arm.roomSkips : 0,
        armorSkipCd: 0,
        floorSkipsLeft: arm && arm.floorSkips ? arm.floorSkips : 0,
        kosmikImmuneCd: 0,
        // Buffs
        luck: skin.id === 'crimson' ? 10 : 0,
        atkMult: 1.0,
        hotRegen: 0,
        hotTimer: 0,
        invisRooms: 0,
        compassActive: false,
        // Inventories
        backpack,
        safeBox: [], // Max 25 slots, preserved on death!
        // Progress
        kills: 0,
        highLootFound: 0,
        // Room State
        doors: [],
        hasStairs: false,
        roomEvent: 'start', // start | treasure | empty | combat | extracting
        roomTreasure: null,
        enemy: null,
        enemyDots: [],
        defending: false,
        combatLog: ['Memasuki Lantai 1 dengan 2 pintu pilihan & Starter Pack.'],
        // 15-second idle/turn countdown
        timerSec: 15.0,
        extractProgress: 0
      };

      // Initial room: exact 2 doors as specified in prompt!
      generateRoomDoors(2, false);
      currentScreen = 'dungeon';
      renderScreen();
      startRunTimers();
    }

    function generateRoomDoors(forcedCount = null, allowStairs = true) {
      const count = forcedCount || (Math.floor(Math.random() * 5) + 1); // 1 to 5 doors
      const doors = [];
      for (let i = 0; i < count; i++) {
        // Pre-roll hidden outcome for V Compas & God Armor vision
        const roll = Math.random();
        const monsterChance = Math.min(0.82, 0.45 + run.floor * 0.004);
        let hintType = 'treasure';
        if (roll < monsterChance * 0.55) hintType = 'strong_monster';
        else if (roll < monsterChance) hintType = 'weak_monster';
        else hintType = 'treasure';

        const safetyPct = hintType === 'treasure' ? (75 + Math.floor(Math.random() * 21))
                        : hintType === 'weak_monster' ? (50 + Math.floor(Math.random() * 20))
                        : (15 + Math.floor(Math.random() * 25));

        doors.push({ index: i + 1, hintType, safetyPct });
      }
      run.doors = doors;
      run.hasStairs = allowStairs && (run.roomNum >= 2 && Math.random() < 0.65);
      run.timerSec = 15.0;
    }

    function startRunTimers() {
      stopAllRunTimers();
      let warnSubTick = 0;
      timerInterval = setInterval(() => {
        if (!run || currentScreen !== 'dungeon') return;
        if (run.roomEvent === 'extracting') return;

        // Passive regens (every 1s tick via 0.2s step)
        const arm = ITEM_DB[run.armorId];
        if (arm && arm.regen) {
          run.hp = Math.min(run.maxHp, run.hp + arm.regen * 0.2);
        }
        if (run.hotTimer > 0) {
          run.hotTimer = Math.max(0, run.hotTimer - 0.2);
          run.hp = Math.min(run.maxHp, run.hp + run.hotRegen * 0.2);
        }
        if (run.kosmikImmuneCd > 0) run.kosmikImmuneCd = Math.max(0, run.kosmikImmuneCd - 0.2);
        if (run.armorSkipCd > 0) run.armorSkipCd = Math.max(0, run.armorSkipCd - 0.2);
        if (run.maxPermSpiritShield > 0 && run.permSpiritShield === 0) {
          run.spiritOrbCd -= 0.2;
          if (run.spiritOrbCd <= 0) {
            run.permSpiritShield = run.maxPermSpiritShield;
            showToast('🔮 Spirit Orb memulihkan +200 Shield!', 'info');
          }
        }

        // Countdown 15 seconds
        run.timerSec -= 0.2;
        if (run.timerSec > 0 && run.timerSec <= 4.0) {
          warnSubTick++;
          if (warnSubTick % 5 === 0) SoundFX.timerWarn();
        } else {
          warnSubTick = 0;
        }
        if (run.timerSec <= 0) {
          run.timerSec = 15.0;
          if (run.roomEvent === 'combat') {
            // Player idled 15s in combat -> Monster attacks with +30% to +45% bonus damage!
            const bonusMult = 1.30 + Math.random() * 0.15;
            addCombatLog(`⏰ Terdiam 15 detik! ${run.enemy.name} menyerang balik dengan +${Math.round((bonusMult - 1) * 100)}% bonus damage!`);
            performEnemyAttack(bonusMult);
          } else {
            // Player idled 15s in exploration -> Forced random door!
            const randDoorIdx = Math.floor(Math.random() * run.doors.length);
            showToast('⏰ Diam 15 detik! Pintu acak terbuka paksa!', 'warn');
            chooseDoor(randDoorIdx, true);
          }
        }
        updateDungeonBars();
      }, 200);
    }

    function updateDungeonBars() {
      if (!run) return;
      const hpBar = document.getElementById('hud-hp-bar');
      const hpTxt = document.getElementById('hud-hp-txt');
      const shTxt = document.getElementById('hud-sh-txt');
      const tmBar = document.getElementById('hud-timer-bar');
      const tmTxt = document.getElementById('hud-timer-txt');

      if (hpBar) hpBar.style.width = `${Math.max(0, Math.min(100, (run.hp / run.maxHp) * 100))}%`;
      if (hpTxt) hpTxt.textContent = `${Math.ceil(run.hp)}/${run.maxHp}`;
      if (shTxt) shTxt.textContent = `${Math.ceil(run.shield + run.permSpiritShield)}`;
      if (tmBar) {
        const pct = Math.max(0, (run.timerSec / 15) * 100);
        tmBar.style.width = `${pct}%`;
        tmBar.className = `h-full transition-all duration-150 ${run.timerSec <= 5 ? 'bg-rose-500' : 'bg-amber-400'}`;
      }
      if (tmTxt) tmTxt.textContent = `${run.timerSec.toFixed(1)}s`;
    }

    function addCombatLog(msg) {
      if (!run) return;
      run.combatLog.unshift(msg);
      if (run.combatLog.length > 5) run.combatLog.pop();
    }

    /* ==========================================================================
       11. ROOM PROGRESSION, LOOT GENERATION & FLOOR 100 MECHANIC
       ========================================================================== */
    function chooseDoor(doorIndex, forced = false) {
      if (!run || run.roomEvent === 'combat' || run.roomEvent === 'extracting') return;
      if (!forced) SoundFX.door();

      const chosen = run.doors[doorIndex] || { hintType: 'treasure' };
      run.roomNum += 1;
      run.compassActive = false;

      // Invisibility potion skips monster encounters safely
      if (run.invisRooms > 0) {
        run.invisRooms--;
        run.roomEvent = 'treasure';
        run.roomTreasure = rollDungeonLoot();
        addCombatLog(`👻 Efek Invisibility menyelinap melewati musuh & menemukan harta!`);
        generateRoomDoors();
        renderScreen();
        return;
      }

      if (chosen.hintType === 'treasure') {
        run.roomEvent = 'treasure';
        run.roomTreasure = rollDungeonLoot();
        addCombatLog(`Ruangan #${run.roomNum}: Menemukan peti harta karun!`);
        generateRoomDoors();
      } else {
        spawnMonster(chosen.hintType === 'weak_monster' ? 0.78 : 1.05);
      }
      renderScreen();
    }

    function descendStairs() {
      if (!run || run.roomEvent === 'combat') return;
      SoundFX.stairs();
      run.floor += 1;
      run.roomNum = 1;
      if (run.floor > player.stats.maxFloor) {
        player.stats.maxFloor = run.floor;
        saveGame();
      }
      run.roomEvent = 'empty';
      run.roomTreasure = null;
      addCombatLog(`🪜 Menuruni tangga menuju Lantai ${run.floor}! Monster lebih kuat, harta lebih langka.`);
      generateRoomDoors(null, true);
      renderScreen();
    }

    function useGodFloorSkip() {
      if (!run || run.floorSkipsLeft <= 0 || run.roomEvent === 'combat') return;
      run.floorSkipsLeft--;
      showToast('👑 God Armor: Melompati langsung ke lantai berikutnya!', 'success');
      descendStairs();
    }

    function useArmorRoomSkip() {
      if (!run || run.armorSkipsLeft <= 0 || run.armorSkipCd > 0) return;
      const arm = ITEM_DB[run.armorId];
      run.armorSkipsLeft--;
      run.armorSkipCd = arm.skipCd || 0;
      run.roomEvent = 'empty';
      run.enemy = null;
      run.enemyDots = [];
      run.roomNum += 1;
      SoundFX.heal();
      showToast(`🪽 ${arm.name}: Berhasil melewati ruangan dengan aman!`, 'success');
      generateRoomDoors();
      renderScreen();
    }

    function rollDungeonLoot() {
      // Floor depth + Luck + Difficulty boost rare rates
      const depthScore = run.floor * 1.4 + run.luck * 0.6 + (run.difficulty.lootMult - 1) * 28;
      let targetRates = ['D', 'C'];

      if (run.floor >= 100) {
        // Floor 100: 60% SSS chance!
        targetRates = Math.random() < 0.60 ? ['SSS', 'SSS+'] : ['SS', 'SS+', 'S+'];
      } else if (depthScore >= 85) {
        targetRates = ['A+', 'S', 'S+', 'SS', 'SS+'];
      } else if (depthScore >= 45) {
        targetRates = ['B+', 'A', 'A+', 'S'];
      } else if (depthScore >= 18) {
        targetRates = ['C', 'B', 'B+', 'A'];
      }

      const pool = Object.values(ITEM_DB).filter(it => targetRates.includes(it.rate));
      const chosen = pool[Math.floor(Math.random() * pool.length)] || ITEM_DB.val_goblet;
      return { uid: genUid(), itemId: chosen.id, chargesLeft: chosen.charges || null };
    }

    function collectRoomTreasure() {
      if (!run || !run.roomTreasure) return;
      const item = ITEM_DB[run.roomTreasure.itemId];
      const cost = getItemSlots(item.id);
      const used = calcUsedSlots(run.backpack);

      if (used + cost > player.backpackCap) {
        SoundFX.hit(false);
        showToast(`Backpack penuh! Butuh ${cost} kotak (Tersisa ${player.backpackCap - used} kotak). Pindahkan ke Brangkas atau buang item!`, 'danger');
        return;
      }

      if (item.id === 'garuda_token') {
        const hasGaruda = [...run.backpack, ...run.safeBox].some(e => e.itemId === 'garuda_token');
        if (hasGaruda) {
          showToast('Hanya dapat membawa 1 Garuda Token tiap permainan!', 'warn');
          return;
        }
      }

      run.backpack.push(run.roomTreasure);
      if (isRateAtLeast(item.rate, 'B+')) run.highLootFound += 1;
      if (item.rate === 'SSS' || item.rate === 'SSS+') {
        player.stats.gotSSS = true;
        saveGame();
      }
      SoundFX.loot(isRateAtLeast(item.rate, 'S'));
      showToast(`Mengambil ${item.name} [${item.rate}] ke Backpack!`, 'success');
      run.roomTreasure = null;
      run.roomEvent = 'empty';
      renderScreen();
    }

    /* ==========================================================================
       12. TURN-BASED COMBAT SYSTEM
       ========================================================================== */
    function spawnMonster(variance = 1.0) {
      const eligible = MONSTERS_DB.filter(m => run.floor >= m.minF);
      const proto = eligible[Math.floor(Math.random() * eligible.length)] || MONSTERS_DB[0];

      const floorScale = 1 + (run.floor - 1) * 0.14;
      const maxHp = Math.round(proto.baseHp * floorScale * run.difficulty.hpMult * variance);
      const dmg = Math.round(proto.baseDmg * floorScale * run.difficulty.dmgMult * variance);

      run.roomEvent = 'combat';
      run.enemy = {
        ...proto,
        hp: maxHp,
        maxHp,
        dmg,
        isBoss100: run.floor >= 100
      };
      run.enemyDots = [];
      run.defending = false;
      run.timerSec = 15.0; // Player always gets first turn!
      addCombatLog(`⚔️ ${run.enemy.name} (Lt.${run.floor}) menghadang jalanmu! Giliranmu pertama!`);
    }

    function combatAttack(useOneSlashKill = false) {
      if (!run || run.roomEvent !== 'combat') return;
      run.defending = false;
      const wep = ITEM_DB[run.weaponId] || { name: 'Tangan Kosong', dmg: 5, rate: 'D' };
      const skin = SKINS_DB.find(s => s.id === player.selectedSkin) || SKINS_DB[0];

      if (useOneSlashKill && run.skillUsesLeft > 0) {
        run.skillUsesLeft--;
        SoundFX.skill();
        addCombatLog(`🐉 ONE SLASH ONE KILL! Tebasan naga hitam memusnahkan ${run.enemy.name} seketika!`);
        run.enemy.hp = 0;
        handleMonsterDefeated();
        return;
      }

      const critChance = skin.id === 'shadow' ? 0.25 : 0.12;
      const isCrit = Math.random() < critChance;
      let totalDmg = Math.round(wep.dmg * run.atkMult * (isCrit ? 1.5 : 1.0));

      run.enemy.hp = Math.max(0, run.enemy.hp - totalDmg);
      const tierIdx = Math.max(0, RATE_ORDER.indexOf(wep.rate || 'D'));
      SoundFX.attack(tierIdx, isCrit);
      addCombatLog(`🗡️ Menyerang ${run.enemy.name} sebesar ${totalDmg} DMG${isCrit ? ' (CRIT!)' : ''}!`);

      // Apply stackable DoT from weapon (Magma, Double Dagger, Excalibur, Nano Machine, Black Flame)
      if (wep.dot) {
        run.enemyDots.push({ ...wep.dot });
        addCombatLog(`✨ Efek [${wep.dot.name}] aktif (${wep.dot.dmg}/detik, ${wep.dot.turns} detik - bertumpuk)!`);
      }

      if (run.enemy.hp <= 0) {
        handleMonsterDefeated();
        return;
      }

      // Trigger DoT ticks + Enemy Turn
      processDotsAndEnemyTurn();
    }

    function combatDefense() {
      if (!run || run.roomEvent !== 'combat') return;
      SoundFX.defend();
      run.defending = true;
      // Small shield recovery on defense
      const arm = ITEM_DB[run.armorId];
      if (arm && run.shield < run.maxShield) {
        run.shield = Math.min(run.maxShield, run.shield + Math.ceil(run.maxShield * 0.15));
      }
      addCombatLog(`🛡️ Bertahan! Mengurangi 65% damage musuh & memulihkan sedikit Shield.`);
      processDotsAndEnemyTurn();
    }

    function combatRun() {
      if (!run || run.roomEvent !== 'combat') return;
      // Run loses 15% to 25% of current HP randomly and skips to random next room!
      const lossPct = 0.15 + Math.random() * 0.10;
      const hpLost = Math.max(1, Math.round(run.hp * lossPct));
      run.hp = Math.max(1, run.hp - hpLost);
      SoundFX.run();
      showToast(`🏃 Kabur ke ruangan acak! Kehilangan ${Math.round(lossPct * 100)}% HP (-${hpLost} HP).`, 'warn');

      run.enemy = null;
      run.enemyDots = [];
      run.roomEvent = 'empty';
      run.roomNum += 1;
      generateRoomDoors();
      renderScreen();
    }

    function processDotsAndEnemyTurn() {
      if (!run || !run.enemy) return;

      // Apply stacked DoTs
      if (run.enemyDots.length > 0) {
        let dotTotal = 0;
        let healFromSoul = 0;
        run.enemyDots.forEach(d => {
          dotTotal += d.dmg;
          if (d.lifesteal) healFromSoul += Math.round(d.dmg * 0.4);
          d.turns -= 1;
        });
        run.enemyDots = run.enemyDots.filter(d => d.turns > 0);
        run.enemy.hp = Math.max(0, run.enemy.hp - dotTotal);
        if (healFromSoul > 0) run.hp = Math.min(run.maxHp, run.hp + healFromSoul);
        addCombatLog(`🔥 Efek elemen memberikan ${dotTotal} DMG tambahan!`);

        if (run.enemy.hp <= 0) {
          handleMonsterDefeated();
          return;
        }
      }

      // Enemy attacks
      performEnemyAttack(1.0);
    }

    function performEnemyAttack(mult = 1.0) {
      if (!run || !run.enemy) return;
      const arm = ITEM_DB[run.armorId];

      let incoming = Math.round(run.enemy.dmg * mult);
      if (run.defending) {
        incoming = Math.round(incoming * 0.35);
        run.defending = false;
      }

      // Kosmik Armor immunity check (immune up to 200 dmg with 15s cooldown)
      if (arm && arm.immuneThreshold && incoming <= arm.immuneThreshold && run.kosmikImmuneCd <= 0) {
        run.kosmikImmuneCd = arm.immuneCd;
        addCombatLog(`🌌 Kosmik Armor menangkis penuh ${incoming} DMG! (CD 15 detik)`);
        run.timerSec = 15.0;
        renderScreen();
        return;
      }

      // Meteor Armor 5% reflect
      if (arm && arm.reflect) {
        const refDmg = Math.max(1, Math.round(incoming * arm.reflect));
        run.enemy.hp = Math.max(0, run.enemy.hp - refDmg);
        addCombatLog(`☄️ Meteor Armor memantulkan ${refDmg} DMG ke ${run.enemy.name}!`);
        if (run.enemy.hp <= 0) {
          handleMonsterDefeated();
          return;
        }
      }

      // Shield Points absorb damage first!
      let rem = incoming;
      if (run.permSpiritShield > 0) {
        const absorbed = Math.min(run.permSpiritShield, rem);
        run.permSpiritShield -= absorbed;
        rem -= absorbed;
        if (run.permSpiritShield === 0) run.spiritOrbCd = 120; // 2 min cooldown
      }
      if (rem > 0 && run.shield > 0) {
        const absorbed = Math.min(run.shield, rem);
        run.shield -= absorbed;
        rem -= absorbed;
      }

      if (rem > 0) {
        run.hp = Math.max(0, run.hp - rem);
        SoundFX.hit(false);
        const canvasWrap = document.getElementById('dungeon-canvas-wrap');
        if (canvasWrap) {
          canvasWrap.classList.remove('anim-shake');
          void canvasWrap.offsetWidth;
          canvasWrap.classList.add('anim-shake');
        }
      } else {
        SoundFX.hit(true);
      }

      addCombatLog(`👹 ${run.enemy.name} menyerang (${incoming} DMG -> Sisa HP: ${Math.ceil(run.hp)}, Shield: ${Math.ceil(run.shield + run.permSpiritShield)}).`);

      if (run.hp <= 0) {
        handlePlayerDeath();
        return;
      }

      // Return turn to player with fresh 15s timer
      run.timerSec = 15.0;
      renderScreen();
    }

    function handleMonsterDefeated() {
      run.kills += 1;
      player.stats.totalKills += 1;
      saveGame();

      const defeatedName = run.enemy.name;
      const wasFloor100 = run.floor >= 100;
      run.enemy = null;
      run.enemyDots = [];
      run.roomEvent = 'treasure';

      // Drop loot! Floor 100 monsters have 60% chance to drop SSS item!
      if (wasFloor100 && Math.random() < 0.60) {
        const sssPool = Object.values(ITEM_DB).filter(i => i.rate === 'SSS' || i.rate === 'SSS+');
        const pick = sssPool[Math.floor(Math.random() * sssPool.length)];
        run.roomTreasure = { uid: genUid(), itemId: pick.id, chargesLeft: pick.charges || null };
        SoundFX.loot(true);
        addCombatLog(`🌟 ${defeatedName} Lantai 100 menjatuhkan item legendaris [${pick.name}] (Rate ${pick.rate})!`);
      } else {
        run.roomTreasure = rollDungeonLoot();
        const dropIt = ITEM_DB[run.roomTreasure.itemId];
        SoundFX.loot(dropIt && isRateAtLeast(dropIt.rate, 'S'));
        addCombatLog(`🏆 ${defeatedName} dikalahkan! Menjatuhkan harta karun.`);
      }

      generateRoomDoors();
      renderScreen();
    }

    /* ==========================================================================
       13. CONSUMABLES, BRANGKAS (25-SLOT SAFE), EXTRACTION & DEATH
       ========================================================================== */
    function useConsumableInRun(uid) {
      if (!run) return;
      const idx = run.backpack.findIndex(e => e.uid === uid);
      if (idx === -1) return;
      const entry = run.backpack[idx];
      const it = ITEM_DB[entry.itemId];
      if (!it || it.type !== 'consumable') return;

      if (it.id === 'garuda_token') {
        showToast('Garuda Token aktif otomatis saat HP mencapai 0!', 'info');
        return;
      }

      let consumeItem = true;

      if (it.heal) {
        run.hp = Math.min(run.maxHp, run.hp + it.heal);
        SoundFX.heal();
        addCombatLog(`💚 Menggunakan ${it.name}: +${it.heal} HP!`);
      }
      if (it.luckBonus) {
        run.luck += it.luckBonus;
        SoundFX.heal();
        addCombatLog(`🍀 Menggunakan ${it.name}: +${it.luckBonus} Luck!`);
      }
      if (it.atkMult) {
        run.atkMult = Math.max(run.atkMult, it.atkMult);
        SoundFX.heal();
        addCombatLog(`💪 Menggunakan ${it.name}: Serangan meningkat!`);
      }
      if (it.hotRegen) {
        run.hotRegen = it.hotRegen;
        run.hotTimer = it.hotDuration;
        SoundFX.heal();
        addCombatLog(`🏆 Holy Grail aktif: +2 HP/detik selama 2 menit!`);
      }
      if (it.permShield) {
        run.maxPermSpiritShield = 200;
        run.permSpiritShield = 200;
        SoundFX.heal();
        addCombatLog(`🔮 Spirit Orb aktif: +200 Shield permanen!`);
      }
      if (it.invisRooms) {
        run.invisRooms += it.invisRooms;
        SoundFX.heal();
        addCombatLog(`👻 Menghilang dari monster selama ${it.invisRooms} ruangan!`);
      }
      if (it.effect === 'compass') {
        if (run.roomEvent === 'combat') {
          showToast('V Compas hanya bisa dipakai saat memilih pintu!', 'warn');
          return;
        }
        run.compassActive = true;
        entry.chargesLeft = (entry.chargesLeft || 5) - 1;
        consumeItem = entry.chargesLeft <= 0;
        SoundFX.heal();
        showToast(`🧭 V Compas menyoroti pintu teraman! (Sisa: ${entry.chargesLeft}x)`, 'success');
      }
      if (it.effect === 'flute' || it.effect === 'clone') {
        if (it.effect === 'flute') {
          entry.chargesLeft = (entry.chargesLeft || 5) - 1;
          consumeItem = entry.chargesLeft <= 0;
        }
        run.enemy = null;
        run.enemyDots = [];
        run.roomEvent = 'empty';
        run.roomNum += 1;
        SoundFX.heal();
        showToast(`✨ ${it.name}: Melewati ruangan/monster tanpa kehilangan HP!`, 'success');
        generateRoomDoors();
      }

      if (consumeItem) {
        run.backpack.splice(idx, 1);
      }

      closeModal();
      run.timerSec = 15.0;
      renderScreen();
    }

    function openInRunBagModal() {
      if (!run) return;
      SoundFX.click();
      const bpUsed = calcUsedSlots(run.backpack);
      const safeUsed = calcUsedSlots(run.safeBox);
      const inCombat = run.roomEvent === 'combat';

      const renderList = (list, location) => {
        if (list.length === 0) return `<div class="text-xs text-gray-500 py-2">Kosong</div>`;
        return list.map(entry => {
          const it = ITEM_DB[entry.itemId];
          const slots = getItemSlots(it.id);
          return `
            <div class="p-2 rounded bg-[#120e18] border border-[#322545] flex items-center justify-between gap-2 text-sm">
              <div class="min-w-0">
                <div class="font-bold text-amber-100 truncate">${it.icon} ${it.name} <span class="text-[10px] px-1 rounded border rate-${it.rate}">${it.rate}</span></div>
                <div class="text-[11px] text-gray-400">${slots} kotak ${entry.chargesLeft ? `(Sisa ${entry.chargesLeft}x)` : ''}</div>
              </div>
              <div class="flex gap-1 shrink-0">
                ${location === 'bp' && it.type === 'consumable'
                  ? `<button onclick="useConsumableInRun('${entry.uid}')" class="btn-pixel btn-emerald px-2 py-1 rounded text-xs">Pakai</button>` : ''}
                ${!inCombat && location === 'bp'
                  ? `<button onclick="moveRunItem('${entry.uid}', 'toSafe')" class="btn-pixel btn-cyan px-2 py-1 rounded text-xs">&rarr; Brangkas</button>` : ''}
                ${!inCombat && location === 'safe'
                  ? `<button onclick="moveRunItem('${entry.uid}', 'toBp')" class="btn-pixel px-2 py-1 rounded text-xs">&larr; Tas</button>` : ''}
                ${!inCombat
                  ? `<button onclick="dropRunItem('${entry.uid}', '${location}')" class="btn-pixel btn-crimson px-1.5 py-1 rounded text-xs">🗑️</button>` : ''}
              </div>
            </div>
          `;
        }).join('');
      };

      openModal(
        inCombat ? '🧪 Gunakan Item Pertarungan' : '🎒 Backpack & Brangkas Aman',
        `
        <div class="space-y-3">
          <div>
            <div class="flex justify-between text-xs font-bold text-amber-300 mb-1">
              <span>🎒 BACKPACK (Hilang jika mati)</span>
              <span>${bpUsed} / ${player.backpackCap} Kotak</span>
            </div>
            <div class="space-y-1.5">${renderList(run.backpack, 'bp')}</div>
          </div>

          ${!inCombat ? `
            <div class="pt-2 border-t border-[#322545]">
              <div class="flex justify-between text-xs font-bold text-cyan-300 mb-1">
                <span>🔐 BRANGKAS (Aman meski mati!)</span>
                <span>${safeUsed} / 25 Kotak</span>
              </div>
              <div class="space-y-1.5">${renderList(run.safeBox, 'safe')}</div>
            </div>
          ` : ''}
        </div>
        `
      );
    }

    function moveRunItem(uid, dir) {
      if (!run || run.roomEvent === 'combat') return;
      if (dir === 'toSafe') {
        const idx = run.backpack.findIndex(e => e.uid === uid);
        if (idx === -1) return;
        const cost = getItemSlots(run.backpack[idx].itemId);
        if (calcUsedSlots(run.safeBox) + cost > 25) {
          showToast('Brangkas penuh! Maksimal 25 kotak.', 'danger');
          return;
        }
        run.safeBox.push(run.backpack[idx]);
        run.backpack.splice(idx, 1);
      } else {
        const idx = run.safeBox.findIndex(e => e.uid === uid);
        if (idx === -1) return;
        const cost = getItemSlots(run.safeBox[idx].itemId);
        if (calcUsedSlots(run.backpack) + cost > player.backpackCap) {
          showToast('Backpack penuh!', 'danger');
          return;
        }
        run.backpack.push(run.safeBox[idx]);
        run.safeBox.splice(idx, 1);
      }
      SoundFX.click();
      openInRunBagModal();
      renderScreen();
    }

    function dropRunItem(uid, loc) {
      if (!run || run.roomEvent === 'combat') return;
      const arr = loc === 'bp' ? run.backpack : run.safeBox;
      const idx = arr.findIndex(e => e.uid === uid);
      if (idx !== -1) arr.splice(idx, 1);
      SoundFX.click();
      openInRunBagModal();
      renderScreen();
    }

    function isCareerTaskDone() {
      if (!run || run.mode !== 'career' || !run.careerTarget) return true;
      const t = run.careerTarget;
      return run.floor >= t.targetFloor && run.kills >= t.targetKills && run.highLootFound >= t.targetHighLoot;
    }

    function triggerExtraction() {
      if (!run || run.roomEvent === 'combat') return;
      if (!isCareerTaskDone()) {
        showToast('Selesaikan seluruh misi Karir terlebih dahulu sebelum Ekstraksi!', 'danger');
        return;
      }

      SoundFX.extract();
      run.roomEvent = 'extracting';
      run.extractProgress = 0;
      renderScreen();

      // Dramatic light beam ascending extraction animation
      const exInterval = setInterval(() => {
        if (!run) { clearInterval(exInterval); return; }
        run.extractProgress += 0.05;
        if (run.extractProgress >= 1) {
          clearInterval(exInterval);
          completeExtraction();
        }
      }, 80);
    }

    function completeExtraction() {
      // Transfer both Backpack & SafeBox items to Lobby Inventory!
      const allLoot = [...run.backpack, ...run.safeBox];
      allLoot.forEach(item => {
        player.lobbyInventory.push({ uid: item.uid, itemId: item.itemId });
      });

      player.stats.extractions += 1;
      let careerRewardMsg = '';

      if (run.mode === 'career' && isCareerTaskDone() && run.careerTarget) {
        player.gold += run.careerTarget.rewardGold;
        player.lobbyInventory.push({ uid: genUid(), itemId: run.careerTarget.rewardItem });
        careerRewardMsg = `<div class="p-2 rounded bg-amber-950/70 border border-amber-500 text-amber-200 text-sm">👑 Misi Karir Lv.${player.careerLevel} Selesai! +${run.careerTarget.rewardGold} Gold & ${ITEM_DB[run.careerTarget.rewardItem].name}!</div>`;
        if (player.careerLevel < CAREER_LEVELS.length) {
          player.careerLevel += 1;
        }
      }

      saveGame();
      stopAllRunTimers();

      const summaryHtml = `
        <div class="space-y-3 text-center">
          <div class="text-4xl">✨🏰✨</div>
          <div class="font-medieval font-bold text-xl text-amber-300">EKSTRAKSI BERHASIL!</div>
          <p class="text-sm text-gray-300">Cahaya suci menarikmu keluar dari Lantai ${run.floor} dengan selamat.</p>
          ${careerRewardMsg}
          <div class="p-2.5 rounded bg-[#120e18] border border-[#36294a] text-left text-sm">
            <div class="text-emerald-400 font-bold mb-1">Total Item Diamankan (${allLoot.length} item):</div>
            <div class="max-h-32 overflow-y-auto space-y-1">
              ${allLoot.length === 0 ? '<div class="text-gray-500">Tidak ada item dibawa.</div>' : allLoot.map(e => {
                const it = ITEM_DB[e.itemId];
                return `<div>${it.icon} ${it.name} <span class="text-xs text-amber-300">[${it.rate}]</span></div>`;
              }).join('')}
            </div>
          </div>
        </div>
      `;

      run = null;
      navigate('lobby');
      openModal('Laporan Ekstraksi', summaryHtml);
    }

    function handlePlayerDeath() {
      // Check Garuda Token (Second life upon death!)
      const garudaBpIdx = run.backpack.findIndex(e => e.itemId === 'garuda_token');
      const garudaSafeIdx = run.safeBox.findIndex(e => e.itemId === 'garuda_token');

      if (garudaBpIdx !== -1 || garudaSafeIdx !== -1) {
        if (garudaBpIdx !== -1) run.backpack.splice(garudaBpIdx, 1);
        else run.safeBox.splice(garudaSafeIdx, 1);

        run.hp = Math.round(run.maxHp * 0.6);
        run.shield = Math.round(run.maxShield * 0.6);
        run.timerSec = 15.0;
        SoundFX.extract();
        showToast('🦅 GARUDA TOKEN AKTIF! Kamu bangkit kembali dari kematian!', 'success');
        addCombatLog('🦅 Garuda Token bersinar dan membangkitkanmu kembali!');
        renderScreen();
        return;
      }

      // True Death: Backpack is LOST, SafeBox (Brangkas) items are SAVED!
      SoundFX.gameover();
      const savedFromSafe = [...run.safeBox];
      savedFromSafe.forEach(item => {
        player.lobbyInventory.push({ uid: item.uid, itemId: item.itemId });
      });
      const lostCount = run.backpack.length;
      const reachedFloor = run.floor;

      saveGame();
      stopAllRunTimers();
      run = null;
      navigate('lobby');

      openModal(
        '💀 GUGUR DI KEGELAPAN',
        `
        <div class="space-y-3 text-center">
          <div class="text-4xl">⚰️</div>
          <div class="font-medieval font-bold text-lg text-rose-400">Petualangan Berakhir di Lantai ${reachedFloor}</div>
          <p class="text-sm text-gray-300">${lostCount} item di dalam Backpack hilang ditelan kegelapan.</p>
          <div class="p-2.5 rounded bg-[#11242b] border border-cyan-700 text-left text-sm">
            <div class="text-cyan-300 font-bold mb-1">🔐 Item Terselamatkan di Brangkas (${savedFromSafe.length} item):</div>
            ${savedFromSafe.length === 0
              ? '<div class="text-gray-400 text-xs">Tidak ada item di Brangkas.</div>'
              : savedFromSafe.map(e => `<div>${ITEM_DB[e.itemId].icon} ${ITEM_DB[e.itemId].name}</div>`).join('')
            }
          </div>
        </div>
        `
      );
    }

    /* ==========================================================================
       15. MODERN PIXEL-ART CANVAS RENDERING (Lobby & Dungeon Scene)
       ========================================================================== */
    function drawPixelRect(ctx, x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
    }

    function drawPixelHero(ctx, cx, cy, scale = 3, tick = 0) {
      const skin = SKINS_DB.find(s => s.id === player.selectedSkin) || SKINS_DB[0];
      const bob = Math.sin(tick * 0.08) * 2;
      const y = cy + bob;

      // Shadow
      drawPixelRect(ctx, cx - 6 * scale, cy + 10 * scale, 12 * scale, 3 * scale, 'rgba(0,0,0,0.45)');
      // Cape
      drawPixelRect(ctx, cx - 5 * scale, y - 2 * scale, 10 * scale, 10 * scale, skin.cape);
      // Body Armor
      drawPixelRect(ctx, cx - 4 * scale, y - 2 * scale, 8 * scale, 8 * scale, skin.color);
      // Helmet / Head
      drawPixelRect(ctx, cx - 3.5 * scale, y - 8 * scale, 7 * scale, 6 * scale, '#cbd5e1');
      // Visor
      drawPixelRect(ctx, cx - 1 * scale, y - 6 * scale, 4 * scale, 2 * scale, '#0f172a');
      // Sword in hand
      drawPixelRect(ctx, cx + 5 * scale, y - 7 * scale, 2 * scale, 10 * scale, '#f8fafc');
      drawPixelRect(ctx, cx + 3.5 * scale, y + 1 * scale, 5 * scale, 1.5 * scale, '#f59e0b');
    }

    function drawPixelMonster(ctx, cx, cy, enemy, scale = 3.4, tick = 0) {
      const bob = Math.cos(tick * 0.1) * 2.5;
      const y = cy + bob;

      // Shadow
      drawPixelRect(ctx, cx - 7 * scale, cy + 10 * scale, 14 * scale, 3 * scale, 'rgba(0,0,0,0.55)');
      // Monster Body
      drawPixelRect(ctx, cx - 6 * scale, y - 7 * scale, 12 * scale, 15 * scale, enemy.color);
      // Horns / Crown
      drawPixelRect(ctx, cx - 6 * scale, y - 10 * scale, 2 * scale, 3 * scale, '#94a3b8');
      drawPixelRect(ctx, cx + 4 * scale, y - 10 * scale, 2 * scale, 3 * scale, '#94a3b8');
      // Glowing Eyes
      drawPixelRect(ctx, cx - 4 * scale, y - 4 * scale, 2.5 * scale, 2 * scale, enemy.eye);
      drawPixelRect(ctx, cx + 1.5 * scale, y - 4 * scale, 2.5 * scale, 2 * scale, enemy.eye);
      // Fangs
      drawPixelRect(ctx, cx - 3 * scale, y + 2 * scale, 6 * scale, 2 * scale, '#fff');
    }

    function drawHeroPreview(canvasId) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawPixelHero(ctx, 40, 44, 3.2, 0);
    }

    function startDungeonCanvasLoop() {
      if (animFrameId) cancelAnimationFrame(animFrameId);
      let tick = 0;

      function loop() {
        const canvas = document.getElementById('dungeon-canvas');
        if (!canvas || !run) return;
        const rect = canvas.parentElement.getBoundingClientRect();
        if (canvas.width !== Math.floor(rect.width) || canvas.height !== Math.floor(rect.height)) {
          canvas.width = Math.floor(rect.width);
          canvas.height = Math.floor(rect.height);
        }

        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;
        tick++;

        // Dungeon Stone Wall Background
        ctx.fillStyle = run.map.theme;
        ctx.fillRect(0, 0, W, H);

        // Brick pattern
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        for (let row = 0; row < H; row += 24) {
          const offset = (row / 24) % 2 === 0 ? 0 : 20;
          for (let col = offset; col < W; col += 40) {
            ctx.fillRect(col, row, 36, 20);
          }
        }

        // Stone Floor
        ctx.fillStyle = '#14111a';
        ctx.fillRect(0, H * 0.72, W, H * 0.28);

        // Flickering Medieval Torches
        [W * 0.15, W * 0.85].forEach((tx, idx) => {
          drawPixelRect(ctx, tx - 3, H * 0.35, 6, 18, '#78350f');
          const flicker = Math.sin(tick * 0.25 + idx) * 3;
          drawPixelRect(ctx, tx - 6, H * 0.27 - flicker * 0.5, 12, 12 + flicker, '#f97316');
          drawPixelRect(ctx, tx - 3, H * 0.29, 6, 7, '#fef08a');
        });

        // Draw Doors in Background when exploring
        if (run.roomEvent !== 'combat') {
          const total = run.doors.length;
          const spacing = W / (total + 1);
          run.doors.forEach((d, i) => {
            const dx = spacing * (i + 1);
            const dy = H * 0.44;
            drawPixelRect(ctx, dx - 16, dy, 32, 48, '#451a03');
            drawPixelRect(ctx, dx - 12, dy + 4, 24, 44, '#78350f');
            // Iron bands
            drawPixelRect(ctx, dx - 12, dy + 14, 24, 3, '#334155');
            drawPixelRect(ctx, dx - 12, dy + 32, 24, 3, '#334155');
            // Compass / God Vision Aura
            const arm = ITEM_DB[run.armorId];
            if ((run.compassActive || (arm && arm.oracleVision)) && d.safetyPct >= 65) {
              ctx.strokeStyle = '#34d399';
              ctx.lineWidth = 2;
              ctx.strokeRect(dx - 18, dy - 2, 36, 52);
            }
          });
        }

        // Draw Hero on Left
        drawPixelHero(ctx, W * 0.26, H * 0.62, 3.2, tick);

        // Draw Treasure Chest or Monster on Right
        if (run.roomEvent === 'treasure' && run.roomTreasure) {
          const cx = W * 0.68, cy = H * 0.64;
          drawPixelRect(ctx, cx - 18, cy - 12, 36, 24, '#92400e');
          drawPixelRect(ctx, cx - 18, cy - 4, 36, 4, '#fbbf24');
          drawPixelRect(ctx, cx - 4, cy - 6, 8, 8, '#fef08a');
        } else if (run.roomEvent === 'combat' && run.enemy) {
          drawPixelMonster(ctx, W * 0.72, H * 0.60, run.enemy, 3.5, tick);
        }

        // Extraction Light Beam Animation!
        if (run.roomEvent === 'extracting') {
          const beamW = 54 + Math.sin(tick * 0.4) * 8;
          const grad = ctx.createLinearGradient(0, 0, 0, H);
          grad.addColorStop(0, 'rgba(56, 189, 248, 0.95)');
          grad.addColorStop(0.6, 'rgba(250, 204, 21, 0.75)');
          grad.addColorStop(1, 'rgba(255, 255, 255, 0.2)');
          ctx.fillStyle = grad;
          ctx.fillRect(W * 0.26 - beamW / 2, 0, beamW, H);
        }

        animFrameId = requestAnimationFrame(loop);
      }
      animFrameId = requestAnimationFrame(loop);
    }

    /* ==========================================================================
       16. INITIALIZE APPLICATION ON WINDOW LOAD
       ========================================================================== */
